# oxiguitar-tuxguitar: the TuxGuitar format plugin for OxiGuitar (#223,
# #171). One plugin file, tuxguitar.oxp, reading and writing TuxGuitar 2's
# files (.tg, a ZIP holding version.txt and content.xml). The binary .tg of
# TuxGuitar 0.7 to 1.5 is not read (docs/design.md).
[package]
name = "oxiguitar-tuxguitar-plugin"
description = "The OxiGuitar format plugin for TuxGuitar files: reads and writes TuxGuitar 2's .tg files."
# 0.0.0 until the first release: the Release button makes it 0.1.0.
version = "0.0.0"
edition = "2024"
# Rust from rustup, raised only when something needs it (CONTRIBUTING.md).
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors"]
repository = "https://github.com/mateusrdp/oxiguitar-tuxguitar"
homepage = "https://github.com/mateusrdp/oxiguitar-tuxguitar"
publish = false

[lib]
# An ordinary library for tests, and tuxguitar.oxp when built with
# `--features oxp --crate-type cdylib` (build-oxp.sh, oxiguitar-plugin-test).
crate-type = ["lib"]

[features]
oxp = []

[dependencies]
# OxiGuitar's SDK and score model, by git: interface 1.7 (OxiGuitar
# 0.18.0). Nothing of OxiGuitar's is on crates.io. The reader reads into the
# core's model and converts it for the plugin interface, the writer the
# other way.
oxiguitar-plugin = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.18.0" }
oxiguitar-model = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.18.0", features = ["wire"] }
# No Rust library reads or writes .tg files, so the format is our own code
# (ported from TuxGuitar's, LGPL-2.1); general crates do the rest, exactly
# as published (Mateus, 9 Nov 2026): content.xml is read with roxmltree,
# written with quick-xml, and the container is a ZIP, as in the MusicXML
# plugin.
roxmltree = "0.21.2"
quick-xml = "0.42.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# The contract suite (tests/contract.rs): builds the .oxp file and checks it
# through OxiGuitar's own plugin host.
oxiguitar-plugin-test = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.18.0" }
serde_json = "1"

# Plugins deny `unsafe` rather than forbid it: `export_plugin!` allows it on
# the two attributes it generates, and nowhere else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Small files. Keep the default `panic = "unwind"`: a panic is then caught
# and the plugin withdrawn instead of closing OxiGuitar.
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
# The fuzz targets (nightly Rust, see fuzz/README.md) have a workspace and
# lock file of their own.
exclude = ["fuzz"]
